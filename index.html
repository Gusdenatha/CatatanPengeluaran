<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Pengeluaran Harian & Bulanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>&#128176; Kelola Pengeluaran</h1>
        
        <div class="card">
            <h3 id="form-title">Tambah Pengeluaran Baru</h3>
            <form id="expense-form">
                <div class="form-group">
                    <label for="date">Tanggal</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="item">Nama Barang / Keperluan</label>
                    <input type="text" id="item" placeholder="Contoh: Beli bensin, Makan siang" required>
                </div>
                <div class="form-group">
                    <label for="amount">Nominal (Rp)</label>
                    <input type="text" id="amount" inputmode="numeric" placeholder="Contoh: 25.000" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="receipt">Foto Bukti (opsional)</label>
                    <input type="file" id="receipt" accept="image/*">
                </div>
                <button type="submit" class="btn-submit" id="submit-button">Simpan Catatan</button>
                <button type="button" class="btn-cancel" id="cancel-edit" hidden>Batal Edit</button>
            </form>
        </div>

        <div class="card">
            <h3>Riwayat Pengeluaran</h3>
            <div class="filter-group">
                <label for="filter-month">Pilih Bulan &amp; Tahun:</label>
                <input type="month" id="filter-month">
            </div>
            <div class="total-box">
                <p>Total Pengeluaran:</p>
                <h2 id="monthly-total">Rp 0</h2>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Barang/Keperluan</th>
                            <th>Nominal</th>
                            <th>Bukti</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list">
                        </tbody>
                </table>
            </div>
        </div>
        <div class="receipt-modal" id="receipt-modal" hidden role="dialog" aria-modal="true" aria-label="Foto bukti">
            <button type="button" class="receipt-modal-close" id="receipt-modal-close" aria-label="Tutup">&times;</button>
            <img id="receipt-modal-image" alt="Foto bukti pengeluaran">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
